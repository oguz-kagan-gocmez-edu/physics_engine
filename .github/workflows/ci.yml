name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        precision: [double, float]
    runs-on: ${{ matrix.os }}
    env:
      # Added to the Makefile's flags for every build step in the job.
      CPPFLAGS: ${{ matrix.precision == 'float' && '-DPHYS_USE_FLOAT' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Build and test
        run: make test
      - name: Run demo scenes
        run: make recordings
